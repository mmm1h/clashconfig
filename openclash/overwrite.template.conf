# OpenClash 专用适配模板；共用 DNS、规则和节点继续在 mihomo.yaml 维护。
# 修改 overwrite.template.conf 或主 YAML 后，Actions 自动生成可订阅的 overwrite.conf。

[General]
ENABLE_CUSTOM_DNS = 0
APPEND_WAN_DNS = 0
APPEND_DEFAULT_DNS = 0
CUSTOM_NAME_POLICY = 0
CUSTOM_FAKEIP_FILTER = 0
CUSTOM_FALLBACK_FILTER = 0
ENABLE_RESPECT_RULES = __RESPECT_RULES__
ENABLE_META_SNIFFER = __SNIFFER_ENABLE__
ENABLE_META_SNIFFER_CUSTOM = 0
CHINA_IP_ROUTE = 1
CHINA_IP_ROUTE_DOMAIN_SOURCE = geosite

# 模块订阅下载后由用户应用，避免后台更新模块时立即重启。
RESTART = false
# 已有缓存时启动不联网；绕行列表独立于主要覆写更新。
# 每天 04:17 检查列表；下载失败保留旧文件，返回更新版本时重启（304 不重启）。
DOWNLOAD_FILE = url=https://raw.githubusercontent.com/mmm1h/clashconfig/main/openclash/bypass_ipv4.list, path=/etc/openclash/custom/openclash_custom_localnetwork_ipv4.list, cron=17 4 * * *, force=false, restart=true

[YAML]
__GENERATED_YAML__
