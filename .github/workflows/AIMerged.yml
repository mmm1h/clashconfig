name: Sync AI and Claude Community Rules

on:
  workflow_dispatch:
  schedule:
    # Daily at 09:00 Asia/Shanghai (01:00 UTC).
    - cron: '0 1 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/AIMerged.yml'
      - 'scripts/update_ai_rules.py'
      - 'tests/test_update_ai_rules.py'
      - 'rules/AI.list'

permissions:
  contents: write

# Both workflows edit AI.list; serialize them and checkout the latest main.
concurrency:
  group: ai-rule-updates
  cancel-in-progress: false

jobs:
  sync-job:
    if: github.repository == 'mmm1h/clashconfig'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check updater safeguards
        run: python -B -m unittest discover -s tests -p 'test_update_ai_rules.py'
      - name: Sync community Claude domains and merged AI list
        run: python -B scripts/update_ai_rules.py
      - name: Commit only changed rule lists
        run: |
          if git diff --quiet -- AIMerged.list rules/AI.list; then
            echo "Upstream AI rules unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- AIMerged.list rules/AI.list
          git commit -m 'chore: refresh community AI and Claude rules'
          git pull --rebase origin main
          git push origin HEAD:main
