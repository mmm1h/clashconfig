name: Sync ChatGPT Voice Rules

on:
  schedule:
    # Daily at 04:23 Asia/Shanghai (20:23 UTC).
    - cron: '23 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/SyncChatGPTVoice.yml'
      - 'scripts/update_chatgpt_voice.py'
      - 'tests/test_update_chatgpt_voice.py'
      - 'rules/AI.list'

permissions:
  contents: write

concurrency:
  group: chatgpt-voice-rules
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'mmm1h/clashconfig'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check updater safeguards
        run: python -m unittest discover -s tests -p 'test_update_chatgpt_voice.py'
      - name: Refresh official voice addresses
        run: python scripts/update_chatgpt_voice.py
      - name: Commit only changed AI rules
        run: |
          if git diff --quiet -- rules/AI.list; then
            echo "Official voice addresses unchanged."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- rules/AI.list
          git commit -m 'chore: refresh official ChatGPT Voice addresses'
          git pull --rebase origin main
          git push origin HEAD:main
