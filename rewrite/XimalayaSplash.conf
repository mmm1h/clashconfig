#!name=喜马拉雅去开屏广告
#!desc=精准拦截喜马拉雅 iOS 的自营与腾讯优量汇开屏广告
#!author=mmm1h

hostname = adse.ximalaya.com, v2mi.gdt.qq.com, us.l.qq.com

# Ximalaya first-party splash response.
^https:\/\/adse\.ximalaya\.com\/ting\/loading(?:\/[^?]*)?(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/mmm1h/clashconfig/main/rewrite/XimalayaLoading.js

# Tencent GDT fallback responses for Ximalaya's known splash placements.
^https:\/\/v2mi\.gdt\.qq\.com\/gdt_mview\.fcg(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/mmm1h/clashconfig/main/rewrite/XimalayaSplash.js
^https:\/\/us\.l\.qq\.com\/exapp(?:\?.*)?$ url script-response-body https://raw.githubusercontent.com/mmm1h/clashconfig/main/rewrite/XimalayaSplash.js
