# Quantumult X / iOS
# 维护与首次导入说明：quantumultx/README.md

[general]
excluded_routes=192.168.0.0/16, 172.16.0.0/12, 100.64.0.0/10, 10.0.0.0/8, 127.0.0.0/8, 224.0.0.0/24, 239.255.255.250/32
network_check_url = http://www.apple.com/library/test/success.html
server_check_url = http://cp.cloudflare.com/generate_204
server_check_timeout = 3000
dns_exclusion_list = *.cmpassport.com, *.jegotrip.com.cn, *.icitymobile.mobi, id6.me, *.pingan.com.cn, *.cmbchina.com, *.ugreen.com, *.ugreengroup.com,*.hmhi.top
geo_location_checker=http://ip-api.com/json/?lang=zh-CN, https://raw.githubusercontent.com/I-am-R-E/Functional-Store-Hub/Master/GeoLocationChecker/QuantumultX/IP-API.js
resource_parser_url = https://fastly.jsdelivr.net/gh/KOP-XIAO/QuantumultX@master/Scripts/resource-parser.js

fallback_udp_policy = reject
# STUN 按分流规则处理；节点不支持 UDP 时仍由 fallback_udp_policy 拒绝。
icmp_auto_reply = true
running_mode_trigger = filter, filter, 派大星:all_direct, wifi2:all_direct

[dns]
no-system
no-ipv6
# 外出时直连和节点引导解析使用加密 DNS；域名命中代理后交节点远端解析。
doh-server = https://223.5.5.5/dns-query, https://223.6.6.6/dns-query
# 特定域名绑定优先于通用 DoH；这两条在家接管全部域名，使用 AdGuard/PaoPaoDNS。
server = /*/192.168.9.20, included_ssids=派大星
server = /*/192.168.9.20, included_ssids=wifi2

[policy]
# --- 核心手动策略组 ---
static=🚀 节点选择, 🔙 全节点故障转移, ♻️ 自动选择, DIRECT, 🇭🇰 香港(云洞), 🇹🇼 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇺🇸 美国, 🌐 其他地区, 🎮 游戏专用
static=🐟 漏网之鱼, 🔙 全节点故障转移, 🚀 节点选择, DIRECT, 🇭🇰 香港(云洞), ♻️ 自动选择, 🇯🇵 日本, 🇺🇸 美国, 🎮 游戏专用
# REJECT 放在首位：首次导入或所选节点消失时拒绝，手动选定具体节点后使用。
static=🤖 AI节点, REJECT, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)(US|America|United States|美国|美|SG|Singapore|新加坡|狮城|坡|JP|Japan|日本|DediOne|Lightsail|xiaohai|gpt|openai)
static=📺 国外媒体, 🔙 全节点故障转移, ♻️ 自动选择, 🇭🇰 香港(云洞), 🚀 节点选择, 🇹🇼 台湾, 🇸🇬 新加坡, 🇯🇵 日本, 🇺🇸 美国
static=🎮 游戏专用, 🔙 全节点故障转移, DIRECT, 🇭🇰 香港(云洞), 🇯🇵 日本, 🇺🇸 美国
static=Ⓜ️ 微软服务, DIRECT, 🚀 节点选择, 🎮 游戏专用
static=🎯 全球直连, DIRECT, 🚀 节点选择
static=🚫 广告屏蔽, REJECT, DIRECT

# --- 普通代理自动切换；AI 不引用这些组 ---
# available 按订阅候选顺序选可用节点，不等同于 Mihomo 的地区回退链。
available=🔙 全节点故障转移, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?!.*(4x|流量|剩余|应急|官网|套餐)).*$
url-latency-benchmark=♻️ 自动选择, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?=.*(HK|Hong Kong|香港|港|🇭🇰|HongKong|xiaohai))(?!.*4x).*$, check-interval=30, alive-checking=true, tolerance=50

# --- 地区筛选策略组 (手动选择) ---
static=🇭🇰 香港(云洞), resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?=.*(HK|Hong Kong|香港|港))(?!.*(2x|4x)).*$
static=🇹🇼 台湾, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)(TW|Taiwan|台湾|台)
static=🇸🇬 新加坡, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?=.*(SG|Singapore|新加坡|狮城|坡|(?:^|-)Lightsail$))(?!.*(2x|4x)).*$
static=🇯🇵 日本, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?=.*(JP|Japan|日本|川日|东京|大阪|泉日|埼玉|沪日|深日))(?!.*(2x|4x)).*$
static=🇺🇸 美国, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?=.*(US|America|United States|美国|美|DediOne))(?!.*(2x|4x)).*$
static=🌐 其他地区, resource-tag-regex=^(云洞|爪云)$, server-tag-regex=(?i)^(?!.*(HK|Hong Kong|香港|港|TW|Taiwan|台湾|台|SG|Singapore|新加坡|狮城|坡|JP|Japan|日本|US|America|United States|美国|美|DediOne|Lightsail|流量|剩余|应急|官网|套餐)).*$


