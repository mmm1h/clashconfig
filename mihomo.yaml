# Clash 配置文件 - mihomo.yaml

#订阅链接
proxy-providers:
  云洞:
    type: http
    url: "__YUNDONG_URL__"
    interval: 7200
    path: "./providers/云洞.yaml"
    override:
      udp: true
    health-check:
      enable: true
      interval: 300
      url: https://cp.cloudflare.com/generate_204

  爪云:
    type: http
    url: "__JP_PRIVATE_URL__"
    interval: 3600
    path: "./providers/爪云.yaml"
    override:
      udp: true
    health-check:
      enable: true
      interval: 300
      url: https://www.gstatic.com/generate_204

# ----------------- 通用基础参数 start ----------------- #
# OpenClash / Clash Party 共用；端口、UI、控制接口与 TUN 启停由客户端管理。
mode: rule
tcp-concurrent: true
unified-delay: true
# 保留按需进程匹配，桌面端的 PROCESS-NAME 规则需要它。
find-process-mode: strict
keep-alive-interval: 15
keep-alive-idle: 600

profile:
  store-selected: true         # 记忆并恢复之前所选的代理节点
  store-fake-ip: true          # 持久化 Fake-IP 数据，防止软路由/系统重启时内网 IP 紊乱

geodata-mode: true
geodata-loader: standard
geo-auto-update: true
geo-update-interval: 24
ipv6: false
geox-url:
  geoip: "https://proxy.hmhi.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
  geosite: "https://proxy.hmhi.top/https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"

# ----------------- 通用基础参数 end ----------------- #

# 客户端仍需开启 TUN；受控 TUN 设置也应保留 UDP/TCP 53 劫持与严格路由。
tun:
  dns-hijack:
    - any:53
    - tcp://any:53
  strict-route: true
  # 国内 IP 集绕行仅限 Linux + nftables + auto-route + auto-redirect；
  # 与 routing-mark 冲突，OpenClash 须由自身路由配置适配。Windows/macOS 不生效。
  route-exclude-address-set:
    - cn_ip
  # 固定网段排除需要客户端启用 auto-route。
  route-exclude-address:
    # Apple 推送通知服务
    - 17.249.0.0/16
    - 17.252.0.0/16
    - 17.57.144.0/22
    - 17.188.128.0/18
    - 17.188.20.0/23
    # 私有、共享及保留地址，保持本地服务直接访问。
    - 0.0.0.0/8
    - 10.0.0.0/8
    - 100.64.0.0/10
    - 127.0.0.0/8
    - 169.254.0.0/16
    - 172.16.0.0/12
    - 192.0.0.0/24
    - 192.0.2.0/24
    - 192.88.99.0/24
    - 192.168.0.0/16
    - 198.51.100.0/24
    - 203.0.113.0/24

sniffer:
  enable: true
  force-dns-mapping: false
  parse-pure-ip: true
  # 使用识别出的域名辅助规则匹配，保留原连接目标。
  override-destination: false
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-dst-address:
    - 17.249.0.0/16
    - 17.252.0.0/16
    - 17.57.144.0/22
    - 17.188.128.0/18
    - 17.188.20.0/23
  skip-domain:
    - "*"
    - "geosite:private"
    - "Mijia Cloud"
    - "+.mi.com"
    - "+.oray.com"
    - "+.sunlogin.net"
    - "+.push.apple.com"

# DNS 列表参考 Nikki v11；引导解析使用 IP，境外 DoH 明确指定代理组。
AliDoH: &AliDoH
  - "https://223.5.5.5/dns-query#DIRECT"
  - "https://223.6.6.6/dns-query#DIRECT"
DomesticDoH: &DomesticDoH
  - "https://dns.alidns.com/dns-query#DIRECT"
  - "https://doh.pub/dns-query#DIRECT"
FreeDoH: &FreeDoH
  - "https://1.1.1.1/dns-query#🔙 全节点故障转移"
  - "https://8.8.8.8/dns-query#🔙 全节点故障转移"
AIDoH: &AIDoH
  - "https://1.1.1.1/dns-query#🤖 AI节点"
  - "https://8.8.8.8/dns-query#🤖 AI节点"

dns:
  enable: true
  enhanced-mode: fake-ip
  ipv6: false
  cache-algorithm: arc
  use-system-hosts: false
  # 保留回环监听，OpenClash 按自身 DNS 接管配置覆写。
  listen: 127.0.0.1:1053
  prefer-h3: false
  respect-rules: true
  default-nameserver: *AliDoH
  proxy-server-nameserver: *AliDoH
  # 与作者一致：未分类域名默认使用国内 DoH。
  nameserver: *AliDoH
  # direct-nameserver 留空，直连连接同样遵循 nameserver-policy。
  nameserver-policy:
    # 复用 AI 规则集中的域名；解析与连接同走 AI 组，不回退国内 DNS。
    "rule-set:Custom_AI": *AIDoH
    # 特例置于大类之前，避免 Steam 社区落到游戏平台的国内 DNS。
    "+.steamcommunity.com": *FreeDoH
    "+.push.apple.com": *DomesticDoH
    "+.mi.com": *DomesticDoH
    "+.sunlogin.net": *DomesticDoH
    "+.pub.3gppnetwork.org": *DomesticDoH
    "+.msftconnecttest.com": *DomesticDoH
    "+.msftncsi.com": *DomesticDoH
    "+.oray.com": *DomesticDoH
    "rule-set:fakeip_filter": *DomesticDoH
    "geosite:category-public-tracker,tracker": *DomesticDoH
    "geosite:apple,icloud": *DomesticDoH
    "geosite:steam,epicgames,xbox,playstation,origin,category-games-cn,category-games-!cn,category-game-accelerator-cn,category-game-platforms-download": *DomesticDoH
    "geosite:google-cn,google-play@cn": *DomesticDoH
    "geosite:jsdelivr,category-ntp,category-ddns,category-speedtest@cn,nvidia@cn,paypal@cn,cn": *DomesticDoH
    # 境外分类兜底必须在国内服务特例之后。
    "geosite:geolocation-!cn": *FreeDoH
  fake-ip-range: 198.18.0.0/15
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "*"
    - "+.lan"
    - "+.local"
    # 常用 Fake IP filter 域名
    - rule-set:fakeip_filter
    # BT/PT
    - "geosite: category-public-tracker,tracker"
    # Microsoft && Apple
    - "geosite: microsoft,onedrive,apple,icloud"
    # 游戏平台（Steam、Epic、PS等）
    - "geosite: steam,epicgames,xbox,playstation,origin,category-games-cn,category-games-!cn,category-game-accelerator-cn,category-game-platforms-download"
    # Google
    - "geosite: google-cn,google-play@cn"
    # 其他
    - "geosite: cloudflare,tailscale,github,private,jsdelivr,category-ntp,category-ddns,category-speedtest@cn,nvidia@cn,paypal@cn,cn"
    - "+.push.apple.com"
    - "+.pub.3gppnetwork.org"
    # 系统连通性检测合集，包含 Windows、Android、Firefox 等。
    - "geosite: connectivity-check"
    - "+.oray.com"
    # 解决 返回ip地址的域名被误判为国外域名的问题
    - "+.hmhi.top"
    - "+.argotunnel.com"
    - "+.cftunnel.com"
    # 保留原 OpenClash 手工设置的设备与密码库兼容例外。
    - "+.ugreen.com"
    - "+.ugreengroup.com"
    - "+.bitwarden.com"

  # 不配置 fallback；AI 规则集、境外分类与显式特例使用代理 DNS，其他未知域名使用国内 DNS。

proxy-groups:
  - name: "🚀 节点选择"
    type: select
    proxies:
      - 🔙 全节点故障转移
      - ♻️ 自动选择
      - DIRECT
      - 🇭🇰 香港(云洞)
      - 🇹🇼 台湾
      - 🇸🇬 新加坡
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🌐 其他地区
      - 🎮 游戏专用

  - name: ♻️ 自动选择
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    tolerance: 50
    use:
      - 云洞
      - 爪云
    filter: '^(?=.*(?i)(HK|Hong Kong|香港|港))(?!.*(?i)(4x)).*$'

  - name: "🔙 全节点故障转移"
    type: fallback
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    timeout: 3000
    lazy: false
    proxies:
      - 🇭🇰 香港(云洞)
      - 🇯🇵 日本
      - 🇸🇬 新加坡
      - 🇹🇼 台湾
      - 🇺🇸 美国
      - 🌐 其他地区-自动

  - name: "📺 国外媒体"
    type: select
    proxies:
      - 🔙 全节点故障转移
      - ♻️ 自动选择
      - 🚀 节点选择
      - 🇭🇰 香港(云洞)
      - 🇹🇼 台湾
      - 🇸🇬 新加坡
      - 🇯🇵 日本
      - 🇺🇸 美国

  - name: "🎮 游戏专用"
    type: select
    proxies:
      - 🔙 全节点故障转移
      - DIRECT
    use:
      - 云洞
    filter: '(?i)(U-4x-BGP-HK|U-2x-BGP-HK|香港-IEPL-Pro|JP-HY2)'

  - name: "Ⓜ️ 微软服务"
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择
      - 🎮 游戏专用

  - name: "🪟 微软下载"
    type: select
    proxies:
      - DIRECT
      - 🇸🇬 新加坡
      - 🇭🇰 香港(云洞)
      - 🚀 节点选择

  - name: "🤖 AI节点"
    type: select
    empty-fallback: REJECT
    url: 'https://chatgpt.com/favicon.ico'
    interval: 300
    tolerance: 100
    use:
      - 云洞
      - 爪云
    filter: '(?i)(US|America|United States|美国|美|SG|Singapore|新加坡|狮城|坡|JP|Japan|日本|DediOne|Lightsail|gpt|openai)'

  - name: "🎯 全球直连"
    type: select
    proxies:
      - DIRECT
      - 🚀 节点选择

  - name: "🚫 广告屏蔽"
    type: select
    proxies:
      - REJECT
      - DIRECT

  - name: "🐟 漏网之鱼"
    type: select
    proxies:
      - 🔙 全节点故障转移
      - 🇭🇰 香港(云洞)
      - 🚀 节点选择
      - DIRECT
      - ♻️ 自动选择
      - 🇯🇵 日本
      - 🇺🇸 美国
      - 🎮 游戏专用

  - name: 🇭🇰 香港(云洞)
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - 云洞
      - 爪云
    filter: '^(?=.*(?i)(HK|Hong Kong|香港|港))(?!.*(?i)(4x)).*$'

  - name: 🇹🇼 台湾
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - 云洞
    filter: '(?i)(TW|Taiwan|台湾|台)'

  - name: 🇸🇬 新加坡
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - 云洞
      - 爪云
    filter: '^(?=.*(?i)(SG|Singapore|新加坡|狮城|坡|Lightsail))(?!.*(?i)(4x)).*$'

  - name: 🇯🇵 日本
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - 云洞
      - 爪云
    filter: '^(?=.*(?i)(JP|Japan|日本|川日|东京|大阪|泉日|埼玉|沪日|深日))(?!.*(?i)(4x)).*$'

  - name: 🇺🇸 美国
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    use:
      - 云洞
      - 爪云
    filter: '^(?=.*(?i)(US|America|United States|美国|美|DediOne))(?!.*(?i)(4x)).*$'

  - name: 🌐 其他地区
    type: select
    empty-fallback: REJECT
    use:
      - 云洞
      - 爪云
    filter: '^(?!.*(?i)(HK|Hong Kong|香港|港|TW|Taiwan|台湾|台|SG|Singapore|新加坡|狮城|坡|JP|Japan|日本|US|America|United States|美国|美|DediOne|Lightsail|流量|剩余|应急|官网|套餐)).*$'

  - name: 🌐 其他地区-自动
    type: url-test
    empty-fallback: REJECT
    url: 'https://cp.cloudflare.com/generate_204'
    interval: 300
    tolerance: 50
    use:
      - 云洞
      - 爪云
    filter: '^(?!.*(?i)(HK|Hong Kong|香港|港|TW|Taiwan|台湾|台|SG|Singapore|新加坡|狮城|坡|JP|Japan|日本|US|America|United States|美国|美|DediOne|Lightsail|4x|流量|剩余|应急|官网|套餐)).*$'

rule-anchor:
  ip: &ip { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  class: &class { type: http, interval: 86400, behavior: classical, format: text }

rule-providers:
  # 中国 IP 段，用于 GEOIP 规则匹配
  cn_ip:
    <<: *ip
    url: "https://proxy.hmhi.top/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"

  # 用于 Fake IP 过滤
  fakeip_filter:
    <<: *domain
    url: "https://proxy.hmhi.top/https://raw.githubusercontent.com/wwqgtxx/clash-rules/release/fakeip-filter.mrs"

  Custom_Direct:
    type: http
    behavior: classical
    url: 'https://proxy.hmhi.top/https://raw.githubusercontent.com/mmm1h/clashconfig/main/rules/Direct.list'
    path: ./ruleset/Direct.yaml
    interval: 86400
    format: text

  Custom_US:
    type: http
    behavior: classical
    url: 'https://proxy.hmhi.top/https://raw.githubusercontent.com/mmm1h/clashconfig/main/rules/US.list'
    path: ./ruleset/US.yaml
    interval: 86400
    format: text
  Custom_AI:
    type: http
    behavior: classical
    url: 'https://proxy.hmhi.top/https://raw.githubusercontent.com/mmm1h/clashconfig/main/rules/AI.list'
    path: ./ruleset/AI.yaml
    interval: 86400
    format: text
  Custom_JP:
    type: http
    behavior: classical
    url: 'https://proxy.hmhi.top/https://raw.githubusercontent.com/mmm1h/clashconfig/refs/heads/main/rules/JP.list'
    path: ./ruleset/JP.yaml
    interval: 86400
    format: text
  Custom_Rules:
    type: http
    behavior: classical
    url: 'https://proxy.hmhi.top/https://raw.githubusercontent.com/mmm1h/clashconfig/main/rules/Rules.list'
    path: ./ruleset/Rules.yaml
    interval: 86400
    format: text

rules:

  # 保留 Android Play Store 的进程特例，其余 AI 连接优先于广告和服务大类。
  - PROCESS-NAME,com.android.vending,🇺🇸 美国
